{{- $id := .Get "id" -}}
{{- $currency := .Get "currency" | default "USD" -}}
{{- $client := site.Params.paypalClientId -}}
{{- if not (.Page.Store.Get "paypalSdkLoaded") -}}
  {{- .Page.Store.Set "paypalSdkLoaded" true -}}
  <script data-cfasync="false" src="https://www.paypal.com/sdk/js?client-id={{ $client }}&components=hosted-buttons&enable-funding=venmo&currency={{ $currency }}"></script>
{{- end -}}
<div id="paypal-container-{{ $id }}" style="max-width: 24rem; margin: 1.5rem 0;"></div>
<script data-cfasync="false">
  paypal.HostedButtons({ hostedButtonId: "{{ $id }}" }).render("#paypal-container-{{ $id }}");
</script>
